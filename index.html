<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Familiare Fluo</title>
  
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <link rel="apple-touch-icon" href="icon.jpg">
  <meta name="theme-color" content="#0b0f19">
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS & Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .neon-border-pink {
      border: 1px solid #ff007f;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
    }
    .neon-border-purp-or {
      border: 1px solid #bf00ff;
      box-shadow: 0 0 10px rgba(191, 0, 255, 0.4);
      background: linear-gradient(135deg, rgba(191, 0, 255, 0.1) 0%, rgba(255, 102, 0, 0.1) 100%);
    }
    .neon-text-orange {
      color: #ff6600;
      text-shadow: 0 0 5px rgba(255, 102, 0, 0.5);
    }
    .neon-text-title {
      background: linear-gradient(135deg, #ff007f 0%, #bf00ff 50%, #ff6600 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 6px rgba(191, 0, 255, 0.5));
    }
    .bg-dark-card {
      background-color: #111827;
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- PIN Screen -->
  <div id="pinScreen" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-dark-card p-6 rounded-2xl neon-border-purp-or text-center max-w-xs w-full">
      <h2 class="text-xl font-bold mb-4 text-[#bf00ff]">Inserisci PIN</h2>
      <input type="password" id="pinInput" maxlength="4" class="w-full text-center text-3xl tracking-widest bg-gray-900 border border-gray-700 rounded-lg p-3 text-[#39ff14] mb-4 focus:outline-none focus:border-[#bf00ff]">
      <button onclick="checkPin()" class="w-full bg-[#bf00ff] text-white font-bold py-3 rounded-lg hover:bg-purple-600 transition shadow-[0_0_10px_rgba(191,0,255,0.4)]">SBLOCCA</button>
    </div>
  </div>

  <!-- Header Nav -->
  <nav class="border-b border-gray-800 bg-[#0d1322] px-4 py-3 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <img src="icon.jpg" alt="Logo" class="w-7 h-7 rounded-lg neon-border-pink object-cover" onerror="this.style.display='none'">
        <h1 class="text-base sm:text-lg font-extrabold tracking-wider neon-text-title uppercase">Budget Familiare</h1>
      </div>
      <div class="flex space-x-2">
        <button id="btnTabDashboard" onclick="switchTab('dashboard')" class="px-3 py-1.5 text-xs sm:text-sm rounded-lg font-semibold bg-[#ff007f] text-white shadow-[0_0_10px_rgba(255,0,127,0.5)]">Dashboard</button>
        <button id="btnTabSettings" onclick="switchTab('settings')" class="px-3 py-1.5 text-xs sm:text-sm rounded-lg font-semibold bg-gray-800 text-gray-300 hover:text-white border border-gray-700">Impostazioni</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto p-4 space-y-6">
    <div id="tabDashboard" class="space-y-6">
      
      <!-- Sezione Filtro Data -->
      <div class="bg-dark-card p-4 rounded-2xl border border-gray-800 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <span class="text-xs font-bold uppercase tracking-wider text-gray-400">Filtra Periodo:</span>
          <button onclick="resetDateFilter()" class="text-xs text-[#ccff00] hover:underline font-semibold">Mostra tutto</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div class="flex items-center space-x-2 bg-gray-900 border border-gray-700 rounded-lg p-2">
            <span class="text-xs text-gray-400 w-8">Dal</span>
            <input type="date" id="filterFrom" onchange="renderDashboard()" class="bg-transparent text-xs text-white focus:outline-none w-full">
          </div>
          <div class="flex items-center space-x-2 bg-gray-900 border border-gray-700 rounded-lg p-2">
            <span class="text-xs text-gray-400 w-8">Al</span>
            <input type="date" id="filterTo" onchange="renderDashboard()" class="bg-transparent text-xs text-white focus:outline-none w-full">
          </div>
        </div>
      </div>

      <!-- Cards Totali -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-dark-card p-5 rounded-2xl border border-[#39ff14] flex flex-col justify-between shadow-[0_0_10px_rgba(57,255,20,0.2)]">
          <span class="text-gray-400 text-sm font-medium">Entrate Periodo</span>
          <span id="txtEntrate" class="text-3xl font-bold text-[#39ff14] mt-2">€ 0.00</span>
        </div>
        <div class="bg-dark-card p-5 rounded-2xl neon-border-pink flex flex-col justify-between">
          <span class="text-gray-400 text-sm font-medium">Uscite Periodo</span>
          <span id="txtUscite" class="text-3xl font-bold text-[#ff007f] mt-2">€ 0.00</span>
        </div>
        <div class="bg-dark-card p-5 rounded-2xl border border-[#ff6600] flex flex-col justify-between shadow-[0_0_10px_rgba(255,102,0,0.2)]">
          <span class="text-gray-400 text-sm font-medium">Bilancio Netto</span>
          <span id="txtSaldo" class="text-3xl font-bold neon-text-orange mt-2">€ 0.00</span>
        </div>
      </div>

      <!-- Form Movimenti & Grafico -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-dark-card p-5 rounded-2xl border border-[#ccff00] lg:col-span-1 shadow-[0_0_10px_rgba(204,255,0,0.2)]">
          <h3 class="text-lg font-bold mb-4 text-[#ccff00]">Nuovo Movimento</h3>
          <form id="txForm" onsubmit="addTransaction(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Tipo</label>
              <select id="txType" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:border-[#ccff00]">
                <option value="uscita">Uscita</option>
                <option value="entrata">Entrata</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Importo (€)</label>
              <input type="number" step="0.01" id="txAmount" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:border-[#ccff00]">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Categoria</label>
              <select id="txCategory" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:border-[#ccff00]"></select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Data</label>
              <input type="date" id="txDate" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:border-[#ccff00]">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Note (facoltativo)</label>
              <input type="text" id="txNote" placeholder="es. Spesa settimanale" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:border-[#ccff00]">
            </div>
            <button type="submit" class="w-full bg-[#ccff00] text-black font-bold py-3 rounded-lg hover:bg-yellow-300 shadow-[0_0_10px_rgba(204,255,0,0.4)]">AGGIUNGI MOVIMENTO</button>
          </form>
        </div>

        <div class="bg-dark-card p-5 rounded-2xl neon-border-purp-or lg:col-span-2 flex flex-col justify-between">
          <h3 class="text-lg font-bold mb-4 text-[#bf00ff]">Ripartizione Spese per Categoria</h3>
          <div class="relative h-64 sm:h-72 w-full flex items-center justify-center">
            <canvas id="chartCategory"></canvas>
          </div>
        </div>
      </div>

      <!-- Tabella Transazioni -->
      <div class="bg-dark-card p-5 rounded-2xl border border-gray-800">
        <h3 class="text-lg font-bold mb-4 text-gray-200">Storico Transazioni</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-900 text-gray-400 uppercase text-xs border-b border-gray-800">
              <tr>
                <th class="p-3">Data</th>
                <th class="p-3">Categoria</th>
                <th class="p-3">Note</th>
                <th class="p-3 text-right">Importo</th>
                <th class="p-3 text-center">Azione</th>
              </tr>
            </thead>
            <tbody id="txTableBody" class="divide-y divide-gray-800"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Impostazioni -->
    <div id="tabSettings" class="space-y-6 hidden">
      <div class="bg-dark-card p-5 rounded-2xl neon-border-pink">
        <h3 class="text-lg font-bold mb-4 text-[#ff007f]">Gestione Categorie Custom</h3>
        <div class="flex flex-col sm:flex-row gap-2 mb-4">
          <input type="text" id="newCatInput" placeholder="Es. Palestra, Animali..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:border-[#ff007f] min-w-0">
          <button onclick="addCategory()" class="bg-[#ff007f] text-white font-bold px-5 py-2.5 rounded-lg hover:bg-pink-600 shrink-0">Aggiungi</button>
        </div>
        <div id="categoriesList" class="flex flex-wrap gap-2"></div>
      </div>

      <div class="bg-dark-card p-5 rounded-2xl border border-gray-800 space-y-4">
        <h3 class="text-lg font-bold text-gray-200">Gestione Dati & Backup</h3>
        <div class="flex flex-wrap gap-3">
          <button onclick="exportJSON()" class="bg-gray-800 border border-purple-500 text-[#bf00ff] font-semibold px-4 py-2 rounded-lg hover:bg-gray-700">Esporta JSON (Backup)</button>
          <button onclick="exportCSV()" class="bg-gray-800 border border-green-500 text-[#39ff14] font-semibold px-4 py-2 rounded-lg hover:bg-gray-700">Esporta CSV (Excel)</button>
          <button onclick="resetCategories()" class="bg-gray-800 border border-yellow-500 text-[#ccff00] font-semibold px-4 py-2 rounded-lg hover:bg-gray-700">Ripristina Categorie Default</button>
        </div>

        <div class="pt-4 border-t border-gray-800">
          <h4 class="text-sm font-semibold text-red-400 mb-2">Zona Pericolosa</h4>
          <button onclick="clearAllData()" class="bg-red-950 border border-red-600 text-red-400 font-bold px-4 py-2 rounded-lg hover:bg-red-900 transition">
            Cancella Tutti i Dati
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const DEFAULT_CATEGORIES = ['Alimentari', 'Casa', 'Auto', 'Svago', 'Utenze', 'Istruzione', 'Spesa', 'Stipendio'];

    let savedCategories = null;
    try {
      savedCategories = JSON.parse(localStorage.getItem('bg_categories'));
    } catch (e) {
      savedCategories = null;
    }

    if (!savedCategories || !Array.isArray(savedCategories) || savedCategories.length === 0) {
      savedCategories = [...DEFAULT_CATEGORIES];
      try { localStorage.setItem('bg_categories', JSON.stringify(savedCategories)); } catch(e) {}
    }

    let savedTransactions = [];
    try {
      savedTransactions = JSON.parse(localStorage.getItem('bg_transactions')) || [];
    } catch (e) {
      savedTransactions = [];
    }

    let state = {
      transactions: savedTransactions,
      categories: savedCategories,
      pin: localStorage.getItem('bg_pin') || null
    };

    let chartInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      try {
        const txDate = document.getElementById('txDate');
        if (txDate) txDate.valueAsDate = new Date();
        if (state.pin) {
          const pinScreen = document.getElementById('pinScreen');
          if (pinScreen) pinScreen.classList.remove('hidden');
        }
        renderCategories();
        renderDashboard();
      } catch (err) {
        console.error("Errore init:", err);
      }
    });

    function checkPin() {
      const val = document.getElementById('pinInput').value;
      if (val === state.pin) {
        document.getElementById('pinScreen').classList.add('hidden');
      } else {
        alert('PIN errato!');
      }
    }

    function switchTab(tab) {
      const dashTab = document.getElementById('tabDashboard');
      const settTab = document.getElementById('tabSettings');
      const btnDash = document.getElementById('btnTabDashboard');
      const btnSett = document.getElementById('btnTabSettings');

      if (!dashTab || !settTab) return;

      if (tab === 'dashboard') {
        dashTab.classList.remove('hidden');
        settTab.classList.add('hidden');
        if (btnDash) btnDash.className = "px-3 py-1.5 text-xs sm:text-sm rounded-lg font-semibold bg-[#ff007f] text-white shadow-[0_0_10px_rgba(255,0,127,0.5)]";
        if (btnSett) btnSett.className = "px-3 py-1.5 text-xs sm:text-sm rounded-lg font-semibold bg-gray-800 text-gray-300 hover:text-white border border-gray-700";
        renderDashboard();
      } else {
        dashTab.classList.add('hidden');
        settTab.classList.remove('hidden');
        if (btnSett) btnSett.className = "px-3 py-1.5 text-xs sm:text-sm rounded-lg font-semibold bg-[#ff007f] text-white shadow-[0_0_10px_rgba(255,0,127,0.5)]";
        if (btnDash) btnDash.className = "px-3 py-1.5 text-xs sm:text-sm rounded-lg font-semibold bg-gray-800 text-gray-300 hover:text-white border border-gray-700";
      }
    }

    function renderCategories() {
      const select = document.getElementById('txCategory');
      const list = document.getElementById('categoriesList');
      if (!select || !list) return;
      select.innerHTML = '';
      list.innerHTML = '';

      state.categories.forEach(cat => {
        select.innerHTML += `<option value="${cat}">${cat}</option>`;
        list.innerHTML += `
          <span class="bg-gray-900 border border-gray-700 text-gray-300 px-3 py-1.5 rounded-lg text-sm flex items-center space-x-2">
            <span>${cat}</span>
            <button onclick="removeCategory('${cat}')" class="text-red-500 hover:text-red-400 font-bold ml-1">&times;</button>
          </span>`;
      });
      try { localStorage.setItem('bg_categories', JSON.stringify(state.categories)); } catch(e) {}
    }

    function addCategory() {
      const input = document.getElementById('newCatInput');
      if (!input) return;
      const val = input.value.trim();
      if (val && !state.categories.includes(val)) {
        state.categories.push(val);
        input.value = '';
        renderCategories();
      }
    }

    function removeCategory(cat) {
      state.categories = state.categories.filter(c => c !== cat);
      renderCategories();
    }

    function resetCategories() {
      if (confirm("Vuoi ripristinare le categorie predefinite?")) {
        state.categories = [...DEFAULT_CATEGORIES];
        renderCategories();
      }
    }

    function addTransaction(e) {
      e.preventDefault();
      const newTx = {
        id: Date.now(),
        type: document.getElementById('txType').value,
        amount: parseFloat(document.getElementById('txAmount').value),
        category: document.getElementById('txCategory').value,
        date: document.getElementById('txDate').value,
        note: document.getElementById('txNote').value.trim()
      };
      state.transactions.unshift(newTx);
      saveAndRender();
      document.getElementById('txAmount').value = '';
      document.getElementById('txNote').value = '';
    }

    function deleteTx(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      saveAndRender();
    }

    function clearAllData() {
      if (confirm("Sei sicuro di voler cancellare TUTTE le transazioni e ripristinare l'app? L'azione non è reversibile.")) {
        try {
          localStorage.removeItem('bg_transactions');
          localStorage.removeItem('bg_categories');
        } catch(e) {}
        state.transactions = [];
        state.categories = [...DEFAULT_CATEGORIES];
        renderCategories();
        renderDashboard();
        alert("Tutti i dati sono stati cancellati con successo.");
      }
    }

    function resetDateFilter() {
      const f = document.getElementById('filterFrom');
      const t = document.getElementById('filterTo');
      if (f) f.value = '';
      if (t) t.value = '';
      renderDashboard();
    }

    function saveAndRender() {
      try {
        localStorage.setItem('bg_transactions', JSON.stringify(state.transactions));
      } catch(e) {}
      renderDashboard();
    }

    function renderDashboard() {
      const fromEl = document.getElementById('filterFrom');
      const toEl = document.getElementById('filterTo');
      const fromVal = fromEl ? fromEl.value : '';
      const toVal = toEl ? toEl.value : '';

      const filteredTx = state.transactions.filter(t => {
        if (fromVal && t.date < fromVal) return false;
        if (toVal && t.date > toVal) return false;
        return true;
      });

      let entrate = 0, uscite = 0;
      const catTotals = {};

      filteredTx.forEach(t => {
        if (t.type === 'entrata') {
          entrate += t.amount;
        } else {
          uscite += t.amount;
          catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
        }
      });

      const txtEntrate = document.getElementById('txtEntrate');
      const txtUscite = document.getElementById('txtUscite');
      const txtSaldo = document.getElementById('txtSaldo');

      if (txtEntrate) txtEntrate.innerText = `€ ${entrate.toFixed(2)}`;
      if (txtUscite) txtUscite.innerText = `€ ${uscite.toFixed(2)}`;
      if (txtSaldo) txtSaldo.innerText = `€ ${(entrate - uscite).toFixed(2)}`;

      const tbody = document.getElementById('txTableBody');
      if (tbody) {
        tbody.innerHTML = '';
        
        if (filteredTx.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">Nessun movimento trovato per il periodo selezionato</td></tr>`;
        } else {
          filteredTx.forEach(t => {
            const isEntrata = t.type === 'entrata';
            tbody.innerHTML += `
              <tr class="hover:bg-gray-900/50">
                <td class="p-3 text-gray-400">${t.date}</td>
                <td class="p-3 font-semibold text-gray-200">${t.category}</td>
                <td class="p-3 text-gray-400">${t.note || '-'}</td>
                <td class="p-3 text-right font-bold ${isEntrata ? 'text-[#39ff14] font-semibold' : 'text-[#ff007f] font-semibold'}">
                  ${isEntrata ? '+' : '-'} €${t.amount.toFixed(2)}
                </td>
                <td class="p-3 text-center">
                  <button onclick="deleteTx(${t.id})" class="text-red-500 hover:text-red-400">Elimina</button>
                </td>
              </tr>`;
          });
        }
      }

      renderChart(catTotals);
    }

    function renderChart(catTotals) {
      if (typeof Chart === 'undefined') return;
      try {
        const canvas = document.getElementById('chartCategory');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        const labels = Object.keys(catTotals);
        const data = Object.values(catTotals);

        if (chartInstance) {
          chartInstance.destroy();
        }

        const displayLabels = labels.length > 0 ? labels : ['Nessuna spesa'];
        const displayData = labels.length > 0 ? data : [1];
        const displayColors = labels.length > 0 
          ? ['#ff007f', '#bf00ff', '#ff6600', '#39ff14', '#ccff00', '#9d4edd', '#ff0055', '#ff9e00']
          : ['#1f2937'];

        chartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: displayLabels,
            datasets: [{
              data: displayData,
              backgroundColor: displayColors,
              borderWidth: 2,
              borderColor: '#111827'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: { color: '#e2e8f0', padding: 15, font: { size: 12 } }
              }
            }
          }
        });
      } catch (err) {
        console.error("Errore grafico:", err);
      }
    }

    function exportJSON() {
      try {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'budget_backup.json';
        a.click();
      } catch(e) {}
    }

    function exportCSV() {
      try {
        let csv = 'Data,Tipo,Categoria,Note,Importo\n';
        state.transactions.forEach(t => {
          csv += `${t.date},${t.type},${t.category},"${t.note || ''}",${t.amount}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'budget_movimenti.csv';
        a.click();
      } catch(e) {}
    }
  </script>
</body>
</html>
